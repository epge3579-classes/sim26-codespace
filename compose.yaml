services:
  web:
    image: nginx:alpine
    restart: unless-stopped

    command:
      - /bin/sh
      - -c
      - |
        until nc -z 127.0.0.1 9000; do
          sleep 0.2
        done
        exec nginx -g 'daemon off;'

    volumes:
      - ./src:/workspace/src:ro
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - appnet

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      APP_ENV: base
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-codespaces_demo}
      DB_USER: ${MYSQL_USER:-appuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-appsecret}
      XDEBUG_MODE: "off"
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    # The PHP container is the Codespace container. Sharing Nginx's
    # network namespace makes Nginx's ports visible from this container,
    # so Codespaces can forward them normally.
    network_mode: "service:web"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codespaces_demo}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-appsecret}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - appnet

volumes:
  dbdata:

networks:
  appnet:
