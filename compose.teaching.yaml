services:
  web:
    # Replace the base Nginx configuration. The teaching version adds
    # a second gateway on port 8081 for phpMyAdmin.
    volumes:
      - ./docker/nginx/teaching.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      phpmyadmin:
        condition: service_started

  php:
    environment:
      APP_ENV: teaching
      XDEBUG_MODE: "off"

    ports:
      - "8080:8080"

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet
